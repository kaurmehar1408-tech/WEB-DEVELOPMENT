<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <header><h1>Fill out the below form for registration</h1></header>
    <main>
    <form>
        <label for="name">
            Name: <input type="text" id="name" name ="Name"><br><br>
        </label>
        <label for="email">
            Email: <input type="email" id="email" name="Email"><br><br>
        </label>
        <label for="pwd">
            Password: <input type="password" id="pwd" name="password"><br><br>
        </label>
        <label for="gen">
        Select your gender : 
        Male: <input type="radio" name="gender" value="M" id="male">
        Female: <input type="radio" name="gender" value="F" id="female"> </label>
        <br><br>
        <label for="Interests">
        Select your matching interests : 
        <input type="checkbox" name="interest" value="aiml" id="Interests">  AI/ML
        <input type="checkbox" name="interest" value="cloud" id="Interests"> Cloud 
        <input type="checkbox" name="interest" value="web dev" id="Interests"> Web Dev
        <input type="checkbox" name="interest" value="cyber" id="Interests"> Cyber 
        </label>
        <br><br>
        Select your course: 
        <select name="course">
            <option value="" disabled selected>Select</option>
            <option value="ML">ML</option>
            <option value="AI">AI</option>
            <option value="Data Science">Data Science</option>
            <option value="Cyber">Cyber</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JS">JS</option>
            <option value="Cloud">Cloud</option>
        </select><br><br>
        <button type="submit">Submit</button> &nbsp;
        <button type="reset">Reset</button>
    </form>
    </main>
    <footer>Thankyou for your precious time !!!</footer>
</body>
</html>
